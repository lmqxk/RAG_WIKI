  <rect x="620" y="1238" width="175" height="72" class="box-muted" />
  <text x="640" y="1264" class="label">Wiki 页面集合</text>
  <text x="640" y="1284" class="small">documents / concepts</text>
  <text x="640" y="1300" class="small">overview / log / related</text>
