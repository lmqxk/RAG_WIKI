  <rect x="60" y="1180" width="760" height="290" class="cluster" />
  <text x="82" y="1212" class="cluster-title">Wiki 派生知识层：规划背景，不是最终证据</text>
  <rect x="85" y="1238" width="150" height="72" class="box" />
  <text x="105" y="1264" class="label">ParsedDocument</text>
  <text x="105" y="1284" class="small">原文 + chunks</text>
  <text x="105" y="1300" class="small">唯一事实来源</text>
  <rect x="255" y="1238" width="160" height="72" class="box-strong" />
  <text x="275" y="1264" class="label">WikiManager</text>
  <text x="275" y="1284" class="small">LLM JSON 分析</text>
  <text x="275" y="1300" class="small">失败则 fallback</text>
  <rect x="435" y="1238" width="165" height="72" class="box" />
  <text x="455" y="1264" class="label">metadata.json</text>
  <text x="455" y="1284" class="small">summary / topics</text>
