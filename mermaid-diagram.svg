<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1515" viewBox="0 0 1680 1515" role="img" aria-labelledby="title desc">
  <title id="title">规智库 RAG 当前技术架构图</title>
  <desc id="desc">展示规智库前端、FastAPI、PDF-Extract-Kit 与 MinerU Web API 双解析管线、Docker Compose 自动启动、统一 parsed 输出、SQLite FTS5、BGE 向量、Qdrant、Wiki 派生层、Agentic Planner、Jina 重排、回答 LLM、图片引用和性能日志。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155" />
    </marker>
    <marker id="arrow-soft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b" />
    </marker>
    <style>
      svg { font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif; background: #f7f7f3; }
