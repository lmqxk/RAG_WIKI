<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1180" viewBox="0 0 1680 1180" role="img" aria-labelledby="title desc">
  <title id="title">规智库 RAG 当前技术架构图</title>
  <desc id="desc">展示前端、后端 API、PDF-Extract-Kit 文档解析、索引存储、Agentic RAG 的 LLM JSON 规划、并行召回、一次全局 Jina 重排、流式回答及性能日志。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155" />
    </marker>
    <marker id="arrow-soft" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#64748b" />
    </marker>
    <style>
      svg { font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif; background: #f7f7f3; }
      .title { font-size: 30px; font-weight: 700; fill: #17202a; }
      .subtitle { font-size: 14px; fill: #64706b; }
      .cluster { fill: #ffffff; stroke: #cfd6d1; stroke-width: 1.5; rx: 14; }
      .cluster-title { font-size: 18px; font-weight: 700; fill: #24312d; }
      .box { fill: #fbfcfb; stroke: #9aa9a2; stroke-width: 1.4; rx: 10; }
      .box-strong { fill: #eef7f1; stroke: #3d8061; stroke-width: 1.8; rx: 10; }
      .box-warn { fill: #fff7e8; stroke: #d29745; stroke-width: 1.6; rx: 10; }
      .box-muted { fill: #f3f5f4; stroke: #b7c0bc; stroke-width: 1.3; rx: 10; }
      .label { font-size: 15px; font-weight: 700; fill: #1f2a26; }
      .text { font-size: 12.5px; fill: #47524e; }
      .small { font-size: 11.5px; fill: #66736e; }
      .tag { font-size: 11px; font-weight: 700; fill: #ffffff; }
      .tag-bg { fill: #2f6f55; rx: 7; }
      .line { stroke: #334155; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .soft-line { stroke: #64748b; stroke-width: 1.5; fill: none; marker-end: url(#arrow-soft); stroke-dasharray: 6 5; }
      .note { fill: #fffaf0; stroke: #e1bc74; stroke-width: 1.2; rx: 10; }
      .mono { font-family: Consolas, "Microsoft YaHei", monospace; font-size: 11.5px; fill: #334155; }
    </style>
  </defs>

  <rect x="0" y="0" width="1680" height="1180" fill="#f7f7f3" />
  <text x="60" y="54" class="title">规智库 RAG 当前技术架构图</text>
  <text x="60" y="82" class="subtitle">当前默认：PDF-Extract-Kit 解析；共享 LLM 输出 JSON 检索计划和最终回答；多步骤并行召回后统一进行一次 Jina 重排。</text>

  <!-- Startup and config -->
  <rect x="60" y="110" width="360" height="185" class="cluster" />
  <text x="82" y="142" class="cluster-title">启动与配置</text>
  <rect x="85" y="162" width="145" height="78" class="box-strong" />
  <text x="105" y="190" class="label">start.cmd</text>
  <text x="105" y="212" class="text">统一启动入口</text>
  <text x="105" y="232" class="small">调用 scripts/run.py</text>
  <rect x="250" y="162" width="145" height="78" class="box" />
  <text x="270" y="190" class="label">Settings</text>
  <text x="270" y="212" class="text">config.py 默认值</text>
  <text x="270" y="232" class="small">.env 仅覆盖私密项</text>
  <rect x="85" y="252" width="310" height="30" class="note" />
  <text x="101" y="272" class="small">默认拉起：API 8000、Web 3000、Rerank 8011</text>

  <!-- Frontend -->
  <rect x="460" y="110" width="330" height="185" class="cluster" />
  <text x="482" y="142" class="cluster-title">前端界面</text>
  <rect x="485" y="162" width="130" height="78" class="box" />
  <text x="505" y="190" class="label">RagDashboard</text>
  <text x="505" y="212" class="text">上传 / 问答</text>
  <text x="505" y="232" class="small">Markdown 渲染</text>
  <rect x="635" y="162" width="130" height="78" class="box" />
  <text x="655" y="190" class="label">资料预览</text>
  <text x="655" y="212" class="text">引用资料弹窗</text>
  <text x="655" y="232" class="small">表格 / 图片预览</text>
  <rect x="485" y="252" width="280" height="30" class="note" />
  <text x="501" y="272" class="small">只展示回答正文引用编号命中的预览图</text>

  <!-- Backend API -->
  <rect x="830" y="110" width="360" height="185" class="cluster" />
  <text x="852" y="142" class="cluster-title">后端 API 层 FastAPI</text>
  <rect x="855" y="162" width="145" height="78" class="box" />
  <text x="875" y="190" class="label">Documents API</text>
  <text x="875" y="212" class="text">upload / reparse</text>
  <text x="875" y="232" class="small">file preview</text>
  <rect x="1020" y="162" width="145" height="78" class="box" />
  <text x="1040" y="190" class="label">RAG API</text>
  <text x="1040" y="212" class="text">ask / jobs</text>
  <text x="1040" y="232" class="small">RagService 编排</text>
  <rect x="855" y="252" width="310" height="30" class="note" />
  <text x="871" y="272" class="small">失败任务可重解析，前端不再长期保留旧错误</text>

  <!-- External LLM -->
  <rect x="1230" y="110" width="390" height="185" class="cluster" />
  <text x="1252" y="142" class="cluster-title">外部模型接口</text>
  <rect x="1255" y="162" width="155" height="78" class="box" />
  <text x="1275" y="190" class="label">Shared LLM</text>
  <text x="1275" y="212" class="text">Planner + Answer</text>
  <text x="1275" y="232" class="small">OpenAI 兼容接口</text>
  <rect x="1430" y="162" width="165" height="78" class="box-muted" />
  <text x="1450" y="190" class="label">EmbeddingProvider</text>
  <text x="1450" y="212" class="text">可选 embedding</text>
  <text x="1450" y="232" class="small">未配置则本地退化</text>
  <rect x="1255" y="252" width="340" height="30" class="note" />
  <text x="1271" y="272" class="small">真实 token 只放 .env，不写入代码仓库</text>

  <!-- Ingestion pipeline -->
  <rect x="60" y="340" width="725" height="315" class="cluster" />
  <text x="82" y="372" class="cluster-title">文档解析与入库链路</text>
  <rect x="90" y="400" width="145" height="78" class="box" />
  <text x="110" y="428" class="label">上传 PDF</text>
  <text x="110" y="450" class="text">storage/uploads</text>
  <text x="110" y="470" class="small">document_id.pdf</text>
  <rect x="265" y="400" width="165" height="78" class="box-strong" />
  <text x="285" y="428" class="label">IngestionManager</text>
  <text x="285" y="450" class="text">后台 job 执行</text>
  <text x="285" y="470" class="small">ThreadPoolExecutor</text>
  <rect x="460" y="400" width="150" height="78" class="box" />
  <text x="480" y="428" class="label">DocumentParser</text>
  <text x="480" y="450" class="text">统一解析入口</text>
  <text x="480" y="470" class="small">pipeline alias</text>
  <rect x="635" y="400" width="120" height="78" class="box-strong" />
  <text x="653" y="428" class="label">PDF-Extract</text>
  <text x="653" y="450" class="text">Kit 1.0</text>
  <text x="653" y="470" class="small">当前默认</text>

  <rect x="90" y="520" width="190" height="82" class="box" />
  <text x="110" y="548" class="label">normalized.json</text>
  <text x="110" y="570" class="text">PageBlock 结构化</text>
  <text x="110" y="590" class="small">text / table / images</text>
  <rect x="305" y="520" width="190" height="82" class="box" />
  <text x="325" y="548" class="label">document.md</text>
  <text x="325" y="570" class="text">人工排查解析质量</text>
  <text x="325" y="590" class="small">保留原始 Markdown</text>
  <rect x="520" y="520" width="235" height="82" class="box-strong" />
  <text x="540" y="548" class="label">表格图片 metadata</text>
  <text x="540" y="570" class="text">caption / row_context</text>
  <text x="540" y="590" class="small">column_context / cell_text</text>

  <rect x="90" y="615" width="665" height="27" class="note" />
  <text x="106" y="634" class="small">MinerU VLM 当前因 CUDA / torch wheel 兼容问题暂跳过；环境修好后可通过 Settings 切换管线。</text>

  <!-- Index storage -->
  <rect x="830" y="340" width="790" height="315" class="cluster" />
  <text x="852" y="372" class="cluster-title">切分、索引与存储</text>
  <rect x="860" y="400" width="170" height="82" class="box-strong" />
  <text x="880" y="428" class="label">build_chunks</text>
  <text x="880" y="450" class="text">章节 / 条款 / 表格</text>
  <text x="880" y="470" class="small">图片上下文进入 chunk</text>
  <rect x="1060" y="400" width="160" height="82" class="box" />
  <text x="1080" y="428" class="label">SQLite</text>
  <text x="1080" y="450" class="text">documents / jobs</text>
  <text x="1080" y="470" class="small">chunks / FTS5</text>
  <rect x="1250" y="400" width="160" height="82" class="box" />
  <text x="1270" y="428" class="label">Qdrant Local</text>
  <text x="1270" y="450" class="text">document_chunks</text>
  <text x="1270" y="470" class="small">向量索引</text>
  <rect x="1440" y="400" width="150" height="82" class="box-muted" />
  <text x="1460" y="428" class="label">Parsed Files</text>
  <text x="1460" y="450" class="text">storage/parsed</text>
  <text x="1460" y="470" class="small">md/json/images</text>

  <rect x="860" y="520" width="730" height="82" class="box" />
  <text x="880" y="548" class="label">重建策略</text>
  <text x="880" y="570" class="text">reindex：复用已有 normalized.json 重建 chunks / FTS / Qdrant</text>
  <text x="880" y="592" class="text">reparse：重新跑 PDF-Extract-Kit，补齐解析、表格图片、normalized.json 新字段</text>

  <rect x="860" y="615" width="730" height="27" class="note" />
  <text x="876" y="634" class="small">图片数据库当前不是独立 image 表，而是随 PageBlock.images 和 chunk preview_image_url 关联。</text>

  <!-- Retrieval and answer -->
  <rect x="60" y="700" width="1560" height="350" class="cluster" />
  <text x="82" y="732" class="cluster-title">问答检索与回答链路</text>
  <rect x="90" y="765" width="150" height="78" class="box" />
  <text x="110" y="793" class="label">用户问题</text>
  <text x="110" y="815" class="text">自然语言查询</text>
  <text x="110" y="835" class="small">可跨文档对比</text>
  <rect x="270" y="765" width="170" height="78" class="box-strong" />
  <text x="290" y="793" class="label">AgenticRetriever</text>
  <text x="290" y="815" class="text">LLM JSON 计划</text>
  <text x="290" y="835" class="small">意图 / 文档 / 步骤</text>
  <rect x="470" y="765" width="145" height="78" class="box" />
  <text x="490" y="793" class="label">并行检索步骤</text>
  <text x="490" y="815" class="text">按文档 / 维度</text>
  <text x="490" y="835" class="small">ThreadPoolExecutor</text>
  <rect x="645" y="765" width="145" height="78" class="box" />
  <text x="665" y="793" class="label">Hybrid Recall</text>
  <text x="665" y="815" class="text">BM25 + Vector</text>
  <text x="665" y="835" class="small">FTS5 / Qdrant</text>
  <rect x="820" y="765" width="145" height="78" class="box" />
  <text x="840" y="793" class="label">合并去重</text>
  <text x="840" y="815" class="text">RRF / exact match</text>
  <text x="840" y="835" class="small">保留跨文档候选</text>
  <rect x="995" y="765" width="170" height="78" class="box-strong" />
  <text x="1015" y="793" class="label">Jina Reranker</text>
  <text x="1015" y="815" class="text">全局仅重排一次</text>
  <text x="1015" y="835" class="small">本地 8011 / GPU 优先</text>
  <rect x="1195" y="765" width="145" height="78" class="box" />
  <text x="1215" y="793" class="label">资料包</text>
  <text x="1215" y="815" class="text">文档平衡 / 引用</text>
  <text x="1215" y="835" class="small">citations + preview</text>
  <rect x="1370" y="765" width="190" height="78" class="box" />
  <text x="1390" y="793" class="label">Answer LLM</text>
  <text x="1390" y="815" class="text">NDJSON 流式回答</text>
  <text x="1390" y="835" class="small">首 token 后逐段输出</text>

  <rect x="270" y="890" width="325" height="95" class="box" />
  <text x="290" y="918" class="label">Planner LLM</text>
  <text x="290" y="940" class="text">自由生成 JSON 查询改写和检索步骤</text>
  <text x="290" y="962" class="text">工具限定为 general / in-document search</text>
  <text x="290" y="982" class="small">失败时回退到本地规则计划</text>
  <rect x="630" y="890" width="350" height="95" class="box" />
  <text x="650" y="918" class="label">性能拆分日志</text>
  <text x="650" y="940" class="text">planner_ms / recall_ms / rerank_ms</text>
  <text x="650" y="962" class="text">answer_llm_ttft_ms / total_ms</text>
  <text x="650" y="982" class="small">storage/logs/chat-metrics.jsonl</text>
  <rect x="1015" y="890" width="350" height="95" class="box-warn" />
  <text x="1035" y="918" class="label">图片资料展示</text>
  <text x="1035" y="940" class="text">回答出现 [n] 才展示该资料预览</text>
  <text x="1035" y="962" class="text">表格图片取 normalized.json images</text>
  <text x="1035" y="982" class="small">caption / row / column context</text>
  <rect x="1395" y="890" width="165" height="95" class="box-warn" />
  <text x="1415" y="918" class="label">Rerank 容错</text>
  <text x="1415" y="940" class="text">8011 不可用时降级词项排序</text>
  <text x="1415" y="962" class="text">模型加载和推理串行化</text>
  <text x="1415" y="982" class="small">避免并发打爆本地 GPU</text>

  <!-- arrows startup -->
  <path d="M230 201 H250" class="line" />
  <path d="M395 201 H460" class="line" />
  <path d="M790 201 H830" class="line" />
  <path d="M1190 201 H1230" class="soft-line" />

  <!-- ingestion arrows -->
  <path d="M240 439 H265" class="line" />
  <path d="M430 439 H460" class="line" />
  <path d="M610 439 H635" class="line" />
  <path d="M695 478 V520" class="line" />
  <path d="M535 478 V520" class="line" />
  <path d="M347 478 V520" class="line" />
  <path d="M755 561 H830" class="line" />

  <!-- storage arrows -->
  <path d="M1030 441 H1060" class="line" />
  <path d="M1030 460 C1120 525 1210 525 1250 460" class="soft-line" />
  <path d="M1410 441 H1440" class="soft-line" />

  <!-- retrieval arrows -->
  <path d="M240 804 H270" class="line" />
  <path d="M440 804 H470" class="line" />
  <path d="M615 804 H645" class="line" />
  <path d="M790 804 H820" class="line" />
  <path d="M965 804 H995" class="line" />
  <path d="M1165 804 H1195" class="line" />
  <path d="M1340 804 H1370" class="line" />
  <path d="M1478 843 V890" class="soft-line" />
  <path d="M355 765 C355 650 1332 650 1332 240" class="soft-line" />
  <path d="M545 765 C545 690 1140 690 1140 482" class="soft-line" />
  <path d="M717 765 C717 690 1330 690 1330 482" class="soft-line" />
  <path d="M1465 765 C1465 680 1332 680 1332 240" class="soft-line" />

  <!-- config defaults legend -->
  <rect x="60" y="1085" width="1560" height="62" class="note" />
  <text x="82" y="1110" class="label">当前关键默认配置</text>
  <text x="82" y="1134" class="mono">document_pipeline=pdf-extract-kit | scan_parser=pdf-extract-kit | agentic_parallel_workers=4 | rerank_base_url=http://127.0.0.1:8011/rerank | rerank_model=jina-reranker-v3.5</text>

  <!-- tags -->
  <rect x="1415" y="44" width="185" height="28" class="tag-bg" />
  <text x="1430" y="63" class="tag">Generated 2026-08-04</text>
</svg>
