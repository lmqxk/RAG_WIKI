  <rect x="85" y="1330" width="710" height="112" class="note" />
  <text x="105" y="1353" class="label">Planner 实际读取边界</text>
  <text x="105" y="1375" class="text">数据库 READY 文档目录：id / title / standard_no / version / filename</text>
  <text x="105" y="1395" class="text">Wiki metadata：summary / topics / concept 名称；不直接读取整篇 Markdown、PDF、图片</text>
  <text x="105" y="1417" class="small">详细 Wiki 页面用于人工导航、显式 wikilink、related 图；未来通过 search_wiki 按需读取</text>

  <rect x="840" y="1180" width="780" height="290" class="cluster" />
  <text x="862" y="1212" class="cluster-title">检索规划与索引执行详图</text>
  <rect x="865" y="1238" width="145" height="72" class="box" />
  <text x="885" y="1264" class="label">用户问题</text>
  <text x="885" y="1284" class="small">问题 + 文档范围</text>
  <text x="885" y="1300" class="small">comparison 判断</text>
  <rect x="1030" y="1238" width="155" height="72" class="box" />
  <text x="1050" y="1264" class="label">QueryPlan</text>
  <text x="1050" y="1284" class="small">代码基础规划</text>
  <text x="1050" y="1300" class="small">类型 / 文档 / focused_query</text>
  <rect x="1205" y="1238" width="175" height="72" class="box-strong" />
  <text x="1225" y="1264" class="label">Planner LLM</text>
  <text x="1225" y="1284" class="small">Wiki metadata + 目录</text>
  <text x="1225" y="1300" class="small">JSON rewrites / steps</text>
  <rect x="1400" y="1238" width="195" height="72" class="box" />
  <text x="1420" y="1264" class="label">校验与执行器</text>
  <text x="1420" y="1284" class="small">工具 / doc_ref / Query</text>
  <text x="1420" y="1300" class="small">并行 ThreadPoolExecutor</text>
  <path d="M1010 1274 H1030" class="line" />
  <path d="M1185 1274 H1205" class="line" />
  <path d="M1380 1274 H1400" class="line" />
  <rect x="865" y="1330" width="730" height="112" class="note" />
  <text x="885" y="1353" class="label">每个检索步骤的索引路径</text>
  <text x="885" y="1375" class="text">search_general / search_in_document → SQLite FTS5 BM25 + Qdrant BGE 512D</text>
  <text x="885" y="1395" class="text">多路候选 → exact clause（有条款号时）→ RRF 融合 → 去重 → 资料覆盖检查</text>
  <text x="885" y="1417" class="small">覆盖不足时补充 Query；所有步骤完成后只调用一次 Jina Reranker，再交给 Answer LLM</text>
  <text x="82" y="1110" class="label">当前关键默认配置</text>
  <text x="82" y="1134" class="mono">document_pipeline=pdf-extract-kit|mineru | mineru_api_url=127.0.0.1:8001 | embedding=BGE-small-zh-v1.5(512D) | Qdrant Local | agentic_workers=4 | rerank=Jina-v3.5</text>

