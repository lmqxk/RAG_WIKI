[project]
name = "backend"
version = "0.1.0"
description = "面向规范和技术文档的 Document Intelligence + Hybrid RAG API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.140.13",
    "huggingface-hub>=0.30.0",
    "httpx>=0.28.1",
    "numpy>=1.24,<2.4",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.28.0",
    "pypdf>=6.14.2",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.18.0",
    "six>=1.17.0",
    "uvicorn[standard]>=0.52.0",
]

[project.scripts]
rag-api = "backend.main:run"
rag-rerank = "backend.rerank_server:run"
rag-worker = "backend.worker:run"

[project.optional-dependencies]
mineru = [
    "mineru[pipeline]>=3.4.4",
]
ocr = [
    "rapidocr>=3.9.2",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
